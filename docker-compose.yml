version: '3.8'

services:
  # PgBouncer 连接池 - 事务池模式
  # 连接的 PostgreSQL 由 .env 中 PG_* 变量决定（外部数据库）
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p0
    container_name: yapp_pgbouncer
    environment:
      DATABASE_URL: "postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}"
      POOL_MODE: transaction  # 事务池模式，每个事务结束后释放连接
      MAX_CLIENT_CONN: 1000   # 最大客户端连接数
      DEFAULT_POOL_SIZE: 25   # 每个数据库的默认连接池大小
      MIN_POOL_SIZE: 5        # 最小连接池大小
      RESERVE_POOL_SIZE: 5    # 保留连接池大小
      RESERVE_POOL_TIMEOUT: 3 # 保留池超时（秒）
      MAX_DB_CONNECTIONS: 50  # 每个数据库的最大连接数
      MAX_USER_CONNECTIONS: 50 # 每个用户的最大连接数
      SERVER_IDLE_TIMEOUT: 600 # 服务器空闲超时（秒）
      SERVER_LIFETIME: 3600   # 服务器连接生命周期（秒）
      SERVER_CONNECT_TIMEOUT: 15 # 服务器连接超时（秒）
      QUERY_TIMEOUT: 0        # 查询超时（0=禁用）
      CLIENT_IDLE_TIMEOUT: 0  # 客户端空闲超时（0=禁用）
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 兼容
    ports:
      - "6432:5432"  # PgBouncer 端口
    networks:
      - yapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Celery Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: yapp_redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - yapp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # Celery Worker - 默认队列
  celery_worker_default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_default
    command: celery -A YamagotiProjects worker -Q default,celery -l info -c 4 --max-tasks-per-child=1000
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Worker - WebScraper 专用队列（2个worker）
  celery_worker_webscraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_webscraper
    command: celery -A YamagotiProjects worker -Q webscraper -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Worker - Shop1 数据清洗专用队列
  celery_worker_shop1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_shop1
    command: celery -A YamagotiProjects worker -Q shop_shop1 -l info -c 1 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Worker - AutoML Preprocessing 专用队列
  celery_worker_automl_preprocessing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_automl_preprocessing
    command: celery -A YamagotiProjects worker -Q automl_preprocessing -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Worker - AutoML Cause and Effect Testing 专用队列
  celery_worker_automl_cause_effect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_automl_cause_effect
    command: celery -A YamagotiProjects worker -Q automl_cause_effect -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Worker - AutoML Quantification of Impact 专用队列
  celery_worker_automl_impact:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_automl_impact
    command: celery -A YamagotiProjects worker -Q automl_impact -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Worker - PSTA Finalize 专用队列（v3新增）
  celery_worker_psta_finalize:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_psta_finalize
    command: celery -A YamagotiProjects worker -Q psta_finalize -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Worker - PSTA Aggregation 专用队列（v3新增）
  celery_worker_psta_aggregation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_psta_aggregation
    command: celery -A YamagotiProjects worker -Q psta_aggregation -l info -c 4 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery Beat - 定时任务调度器
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_beat
    command: celery -A YamagotiProjects beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Django Web 服务 (ASGI with Daphne)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_web
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 YamagotiProjects.asgi:application"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=${PG_DATABASE}
      - PGBOUNCER_USER=${PG_USER}
      - PGBOUNCER_PASSWORD=${PG_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - yapp_network
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Flower - Celery 监控工具（可选）
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_flower
    command: celery -A YamagotiProjects flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    networks:
      - yapp_network
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  static_data:
    driver: local
  media_data:
    driver: local

networks:
  yapp_network:
    driver: bridge
