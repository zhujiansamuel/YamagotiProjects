# =============================================================================
# PostgreSQL 独立容器配置 (开发环境)
# =============================================================================
# 用法:
#   docker compose -f docker-compose.local-pg.yml up -d
#
# 此文件用于启动独立的 PostgreSQL 容器，供 docker-compose.dev.yml 使用。
# docker-compose.dev.yml 中的服务通过 host.docker.internal:5433 连接此数据库。
#
# 数据库恢复:
#   docker exec -i local-pg pg_restore -U postgres -d applestockchecker_dev < ~/sources/local-pg-applestockchecker_dev.dump
# =============================================================================

version: '3.8'

services:
  local-pg:
    image: postgres:16
    container_name: local-pg
    environment:
      POSTGRES_DB: applestockchecker_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpass
    ports:
      - "5433:5432"
    volumes:
      - local_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d applestockchecker_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  local_pg_data:
    driver: local
