# Docker Compose 开发环境配置
# 使用方法: docker compose -f docker-compose.dev.yml up -d
#
# 特点:
# - 直接复用宿主机已有的 local-pg (postgres:5433)，不再启动 db/pgbouncer
# - Celery workers 可选启动
# - 代码热重载
# - 本地开发更轻量

version: '3.8'

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: yapp_redis_dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - yapp_network_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data_dev:/data

  # Django Web 服务 (开发模式 - 使用 runserver 支持热重载)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_web_dev
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=false
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5433
      - POSTGRES_DATABASE=applestockchecker_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localpass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DJANGO_ENV=dev
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
      - static_data_dev:/app/staticfiles
      - media_data_dev:/app/media
    restart: unless-stopped

  # Celery Worker - 默认队列 (开发时可选)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_worker_dev
    command: celery -A YamagotiProjects worker -Q default,celery -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=false
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5433
      - POSTGRES_DATABASE=applestockchecker_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localpass
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery  # 使用 --profile celery 启动

  # Celery Worker - WebScraper 专用队列 (开发时可选)
  celery_worker_webscraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_webscraper_dev
    command: celery -A YamagotiProjects worker -Q webscraper -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=false
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5433
      - POSTGRES_DATABASE=applestockchecker_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localpass
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery

  # Celery Worker - AutoML Preprocessing 专用队列 (开发时可选)
  celery_worker_automl_preprocessing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_automl_preprocessing_dev
    command: celery -A YamagotiProjects worker -Q automl_preprocessing -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=false
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5433
      - POSTGRES_DATABASE=applestockchecker_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localpass
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery

  # Celery Worker - AutoML Cause and Effect Testing 专用队列 (开发时可选)
  celery_worker_automl_cause_effect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_automl_cause_effect_dev
    command: celery -A YamagotiProjects worker -Q automl_cause_effect -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=false
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5433
      - POSTGRES_DATABASE=applestockchecker_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localpass
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery

  # Celery Worker - AutoML Quantification of Impact 专用队列 (开发时可选)
  celery_worker_automl_impact:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_automl_impact_dev
    command: celery -A YamagotiProjects worker -Q automl_impact -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=false
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5433
      - POSTGRES_DATABASE=applestockchecker_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localpass
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery

  # Celery Beat (开发时可选)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_beat_dev
    command: celery -A YamagotiProjects beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=false
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5433
      - POSTGRES_DATABASE=applestockchecker_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localpass
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery  # 使用 --profile celery 启动

  # Flower (开发时可选)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_flower_dev
    command: celery -A YamagotiProjects flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery  # 使用 --profile celery 启动

volumes:
  redis_data_dev:
    driver: local
  static_data_dev:
    driver: local
  media_data_dev:
    driver: local

networks:
  yapp_network_dev:
    driver: bridge
