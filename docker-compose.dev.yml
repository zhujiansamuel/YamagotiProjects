# Docker Compose 开发环境配置
# 使用方法: docker compose -f docker-compose.dev.yml up -d
#
# 特点:
# - 只启动基础服务 (db, redis, pgbouncer) + web
# - Celery workers 可选启动
# - 代码热重载
# - 本地开发更轻量

version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: yapp_postgres_dev
    environment:
      POSTGRES_DB: applestockchecker_dev
      POSTGRES_USER: samuelzhu
      POSTGRES_PASSWORD: Xdb73008762
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=128MB"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - yapp_network_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samuelzhu -d applestockchecker_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer 连接池
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    container_name: yapp_pgbouncer_dev
    environment:
      DATABASE_URL: "postgres://samuelzhu:Xdb73008762@db:5432/applestockchecker_dev"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6432:5432"
    networks:
      - yapp_network_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: yapp_redis_dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - yapp_network_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data_dev:/data

  # Django Web 服务 (开发模式 - 使用 runserver 支持热重载)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_web_dev
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=applestockchecker_dev
      - PGBOUNCER_USER=samuelzhu
      - PGBOUNCER_PASSWORD=Xdb73008762
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DJANGO_ENV=dev
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
      - static_data_dev:/app/staticfiles
      - media_data_dev:/app/media
    restart: unless-stopped

  # Celery Worker - 默认队列 (开发时可选)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_worker_dev
    command: celery -A YamagotiProjects worker -Q default,celery -l info -c 2 --max-tasks-per-child=100
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=applestockchecker_dev
      - PGBOUNCER_USER=samuelzhu
      - PGBOUNCER_PASSWORD=Xdb73008762
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery  # 使用 --profile celery 启动

  # Celery Beat (开发时可选)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_celery_beat_dev
    command: celery -A YamagotiProjects beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=YamagotiProjects.settings
      - USE_PGBOUNCER=true
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_DATABASE=applestockchecker_dev
      - PGBOUNCER_USER=samuelzhu
      - PGBOUNCER_PASSWORD=Xdb73008762
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery  # 使用 --profile celery 启动

  # Flower (开发时可选)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapp_flower_dev
    command: celery -A YamagotiProjects flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    networks:
      - yapp_network_dev
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - celery  # 使用 --profile celery 启动

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  static_data_dev:
    driver: local
  media_data_dev:
    driver: local

networks:
  yapp_network_dev:
    driver: bridge
